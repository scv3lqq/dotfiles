# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Options
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on

# Vi mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Splits
unbind %
unbind '"'
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resize
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# Clear screen (since C-l is taken by vim-tmux-navigator)
bind C-l send-keys 'C-l'

# Reload
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Sessions: fzf popup with terminal preview and ctrl-d to delete session
bind s display-popup -E "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --ansi \
  --preview 'tmux capture-pane -pt \$(echo {} | cut -d\" \" -f1) -e' \
  --bind 'ctrl-d:execute(tmux kill-session -t \$(echo {} | cut -d: -f1))+reload(tmux list-windows -a -F \"#{session_name}:#{window_index} #{window_name}\")' \
  | cut -d' ' -f1 | xargs tmux switch-client -t"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'egel/tmux-gruvbox'

set -g @tmux-gruvbox 'dark'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'

run '~/.tmux/plugins/tpm/tpm'

# Force black status bar (must come after tpm: egel/tmux-gruvbox sets these on init)
set -g status-style 'bg=#000000,fg=#ebdbb2'
set -g status-left-style 'bg=#000000'
set -g status-right-style 'bg=#000000'
set -g window-status-style 'bg=#000000'
set -g window-status-current-style 'bg=#000000,fg=#fabd2f'
