# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Options
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on

# Vi mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Splits
unbind %
unbind '"'
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resize
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# Clear screen (since C-l is taken by vim-tmux-navigator)
bind C-l send-keys 'C-l'

# Reload
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Sessions: collapsed session tree in an fzf popup (tmux/session-picker.sh);
# tmux's own tree where fzf is missing or older than 0.73
if-shell '~/dotfiles/tmux/session-picker.sh --supported' \
  'bind s display-popup -B -E -w 85% -h 80% "~/dotfiles/tmux/session-picker.sh"' \
  'bind s choose-tree -Zs'

# Layout repair: tmux 3.7 select-layout skips the window resize for single-pane
# layouts, so resurrect leaves the layout at its saved size inside a bigger
# window (the rest is drawn as dots). resize-window to the same size rebuilds
# the layout but pins window-size to manual, hence the unset. run-shell because
# resize-window does not expand formats in -x/-y.
set -g command-alias[100] fix-layout-size="if -F '#{?#{m/r:^[0-9a-f]+#,#{window_width}x#{window_height}#,,#{window_layout}},0,1}' 'run-shell \"tmux resize-window -t #{window_id} -x #{window_width} -y #{window_height}; tmux set -wu -t #{window_id} window-size\"'"
set-hook -g session-window-changed[10] fix-layout-size
set-hook -g client-session-changed[10] fix-layout-size
set-hook -g client-attached[10] fix-layout-size

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'vaaleyard/tmux-dotbar'
# continuum hooks autosave into status-right: must load after the theme
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# hooks resurrect's post-save/post-restore: must load after resurrect and continuum
set -g @plugin 'timvw/tmux-assistant-resurrect'

set -g @tmux-dotbar-bg "#0B0E14"
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run '~/.tmux/plugins/tpm/tpm'
