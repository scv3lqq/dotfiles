"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 2000

format = '$character$directory$git_branch${custom.git_dirty}'

[character]
format = '$symbol  '
success_symbol = '[➜](bold #565B66)'
error_symbol = '[➜](bold #F07178)'

[directory]
format = '[$path]($style) '
style = 'bold'
truncation_length = 1
truncate_to_repo = false

[git_branch]
format = '[git:\(](#565B66)[$branch](#D2A6FF)[\)](#565B66) '

# Single robbyrussell-style dirty mark instead of the git_status symbol set
[custom.git_dirty]
when = 'test -n "$(git status --porcelain --ignore-submodules=dirty 2>/dev/null | head -n1)"'
require_repo = true
shell = ['sh']
symbol = '✗'
style = '#FFB454'
format = '[$symbol]($style) '
